name: Publish to PyPI
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      repository:
        description: Destination index
        type: choice
        options:
          - pypi
          - testpypi
        default: pypi
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ".[publish]"
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ (github.event.inputs.repository || 'pypi') == 'testpypi' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
          password: ${{ (github.event.inputs.repository || 'pypi') == 'testpypi' && secrets.TEST_PYPI_API_TOKEN || secrets.PYPI_API_TOKEN }}
          skip-existing: true
