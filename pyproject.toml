[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prismcognition"
authors = [{ name = "Amin Parva" }]
version = "2.1.0"
description = "Evidence-aware AI deliberation for Python: preserve disagreement, trace provenance, and replay reasoning artifacts."
readme = "README.md"
keywords = ["ai deliberation", "llm orchestration", "evidence grounding", "provenance", "decision support", "python"]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.6",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "pytest-cov>=5.0",
    "build>=1.2",
]

[project.scripts]
prismcognition = "prismcognition.cli:main"

[tool.setuptools.packages.find]
include = ["prismcognition*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["prismcognition"]

[tool.coverage.report]
show_missing = true
fail_under = 93
