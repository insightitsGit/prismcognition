name: Library checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[dev]"
      - run: python -m pytest -q --cov=prismcognition --cov-report=term-missing --cov-report=xml --junitxml=test-results.xml
      - run: python -m build
      - name: Install wheel outside checkout
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/prism-wheel"
          if [ "$RUNNER_OS" = "Windows" ]; then
            PY="$RUNNER_TEMP/prism-wheel/Scripts/python.exe"
          else
            PY="$RUNNER_TEMP/prism-wheel/bin/python"
          fi
          "$PY" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$PY" -c "import prismcognition; from prismcognition.api.app import create_app; assert create_app().title == 'PrismCognition'"
          "$PY" -m prismcognition --help
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.os }}-${{ matrix.python }}
          path: |
            coverage.xml
            test-results.xml
            dist/*
