[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "prismcognition"
authors = [{ name = "Amin Parva" }]
version = "2.1.0"
description = "Evidence-aware AI deliberation for Python: preserve disagreement, trace provenance, and replay reasoning artifacts."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["ai deliberation", "llm orchestration", "evidence grounding", "provenance", "decision support", "python"]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.6",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "pytest-cov>=5.0",
    "build>=1.2",
    "twine>=5.1",
]
publish = [
    "build>=1.2",
    "twine>=5.1",
]

[project.urls]
Homepage = "https://github.com/insightitsGit/prismcognition"
Repository = "https://github.com/insightitsGit/prismcognition"
Issues = "https://github.com/insightitsGit/prismcognition/issues"
Documentation = "https://github.com/insightitsGit/prismcognition/blob/main/docs/design/prismcognition-v2.1-architecture.md"

[project.scripts]
prismcognition = "prismcognition.cli:main"

[tool.setuptools.packages.find]
include = ["prismcognition*"]

[tool.setuptools.package-data]
prismcognition = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["prismcognition"]

[tool.coverage.report]
show_missing = true
fail_under = 93
